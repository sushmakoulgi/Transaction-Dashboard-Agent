name: transaction-dashboard

# The whole stack: `make up-stack` (or `docker compose up -d --build`), then open
# http://localhost:5173. `make up` still starts only Postgres, for running services on the host.
#
# Containers read secrets from .env; the addresses below replace the localhost ones in .env
# with in-network names. Host ports are configurable, so the stack can run next to services
# started from VS Code (e.g. TRANSACTION_SERVICE_HOST_PORT=8201).

x-python-service: &python-service
  image: transaction-dashboard-services:local
  env_file: .env
  restart: unless-stopped

x-healthcheck-timing: &healthcheck-timing
  interval: 5s
  timeout: 3s
  retries: 20

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      <<: *healthcheck-timing

  # One-shot: migrations (always) and sample data (only into an empty database).
  db-setup:
    <<: *python-service
    build:
      context: .
      dockerfile: services.Dockerfile
    restart: "no"
    command: ["python", "-m", "transaction_database.setup"]
    environment:
      POSTGRES_DSN_OWNER: postgresql+psycopg://app_owner:${APP_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_DSN_READONLY: postgresql+psycopg://app_readonly:${APP_READONLY_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  transaction-service:
    <<: *python-service
    command: ["uvicorn", "transaction_service.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8200"]
    environment:
      POSTGRES_DSN_READONLY: postgresql+psycopg://app_readonly:${APP_READONLY_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${TRANSACTION_SERVICE_HOST_PORT:-8200}:8200"
    depends_on:
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      <<: *healthcheck-timing

  mcp-server:
    <<: *python-service
    command: ["uvicorn", "mcp_server.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      TRANSACTION_SERVICE_URL: http://transaction-service:8200
      # Let other containers reach it by name; DNS-rebinding protection stays on.
      MCP_ALLOWED_HOSTS: '["127.0.0.1:*", "localhost:*", "[::1]:*", "mcp-server:*"]'
    ports:
      - "${MCP_SERVER_HOST_PORT:-8100}:8100"
    depends_on:
      transaction-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      <<: *healthcheck-timing

  agent-service:
    <<: *python-service
    command: ["uvicorn", "agent_service.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MCP_SERVER_URL: http://mcp-server:8100/mcp
      TRANSACTION_SERVICE_URL: http://transaction-service:8200
      CHROMA_URL: http://chroma:8000
      CORS_ALLOWED_ORIGINS: '["http://localhost:${UI_HOST_PORT:-5173}"]'
    ports:
      - "${AGENT_SERVICE_HOST_PORT:-8000}:8000"
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      <<: *healthcheck-timing

  ui:
    build:
      context: ui
      args:
        # The browser calls the agent through its published port. The token is compiled into
        # the page (local, single-user use only).
        VITE_AGENT_API_URL: http://localhost:${AGENT_SERVICE_HOST_PORT:-8000}
        VITE_AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
    image: transaction-dashboard-ui:local
    restart: unless-stopped
    ports:
      - "${UI_HOST_PORT:-5173}:80"
    depends_on:
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]  # IPv4: nginx listens on 0.0.0.0
      <<: *healthcheck-timing

  # Plan cache store (Phase 2a). The agent doesn't wait for it: while Chroma is down, every
  # question goes to Claude.
  chroma:
    image: chromadb/chroma:${CHROMA_IMAGE_TAG:-1.5.9}
    restart: unless-stopped
    ports:
      - "${CHROMA_HOST_PORT:-8010}:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      # The image has bash but no curl/wget: ask the heartbeat endpoint over /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\r\n\r\n' >&3 && grep -q nanosecond <&3"
      <<: *healthcheck-timing

  # On hold (Phase 2b, decided from the plan cache's exact_match_rate): `--profile phase2`.
  redis:
    image: redis:7.4-alpine
    profiles: ["phase2"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:
  postgres-data:
  chroma-data:
