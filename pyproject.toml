[project]
name = "transaction-dashboard"
version = "0.1.0"
description = "Natural-language transaction dashboard: Claude agent, MCP tools, read-only Transaction Service."
requires-python = ">=3.12"
dependencies = [
    "agent-service",
    "mcp-server",
    "shared",
    "transaction-database",
    "transaction-service",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
agent-service = { workspace = true }
mcp-server = { workspace = true }
shared = { workspace = true }
transaction-database = { workspace = true }
transaction-service = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["agent_service", "mcp_server", "shared", "transaction_database", "transaction_service"]

[tool.pyright]
# Lets Pylance / Pyright in the editor use the project's virtual environment.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs the docker-compose Postgres (make up migrate)"]

[tool.ruff.lint.isort]
known-first-party = ["agent_service", "mcp_server", "shared", "transaction_database", "transaction_service"]
