[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server exposing the Transaction Service as tools (Streamable HTTP)."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "pydantic-settings>=2.6",
    "shared",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
