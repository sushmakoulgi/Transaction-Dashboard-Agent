[project]
name = "transaction-database"
version = "0.1.0"
description = "ORM models, migrations and sample-data seeding for the transactions database."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "shared",
    "sqlalchemy>=2.0.36",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
